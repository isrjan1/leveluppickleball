<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pickleball Level Up</title>
<script src="vendor/qrcode.min.js" defer onload="typeof draw==='function'&&draw(true)"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#FFF6D9">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Single light theme; gold for buttons and highlights. No blue. */
:root{box-sizing:border-box;color-scheme:light;
--gold:#FEBC17;--ball:#FEBC17;--ongold:#14100A;--accent:var(--gold);
--disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;
--fs:clamp(15px,.9rem + .25vw,17px);--gap:clamp(12px,3.2vw,20px);--pad:clamp(14px,3.6vw,22px)}
/* Light theme: soft, light surfaces; gold only for buttons and highlights */
:root{--hdr:#FFF6D9;--hdr-text:#1A1A1A;--hdr-mute:#6B5200;--hdr-chip:rgba(20,16,10,.07);--hdr-line:rgba(20,16,10,.12);--hdr-panel:#FFEDB5;--hdr-fill:#FEBC17;
--navy:#FFF6D9;--navy2:#FFEDB5;--gt:#7A4E00;--bg:#FFFDF8;--card:#fff;--soft:#F8F4E8;--line:#ECE6D6;--text:#1A1A1A;--muted:#6A665C;--up:#128A55;--down:#C93C3C;--btn:#FEBC17;--btn-text:#14100A}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.55 var(--body);min-height:100vh;min-height:100dvh;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--gt)}
.app{max-width:560px;margin:0 auto;padding:0 0 calc(88px + env(safe-area-inset-bottom,0px))}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:clamp(6px,2vw,10px);padding:calc(10px + env(safe-area-inset-top,0px)) var(--pad) 10px;background:var(--hdr);color:var(--hdr-text);border-bottom:1px solid var(--hdr-line)}
.bar .brand{font:700 clamp(20px,5vw,24px)/1 var(--disp);letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap}
.bar .brand{display:flex;align-items:center;line-height:0}
.bar .brand img{display:block;height:clamp(34px,10.5vw,48px);width:auto;max-width:100%;aspect-ratio:1;object-fit:contain;border-radius:11px}
@media(max-width:359px){.bar .brand img{height:32px}.bar .role{display:none}}
.bar .role{font:600 13px var(--disp);color:var(--hdr-text);border:1px solid var(--hdr-line);border-radius:999px;padding:2px 10px}

/* rating hero: the one loud element */
.hero{position:relative;overflow:hidden;background:var(--hdr);color:var(--hdr-text);padding:clamp(18px,4vw,28px) var(--pad) clamp(22px,4.5vw,32px)}
.hero svg.court{position:absolute;inset:0;width:100%;height:100%;opacity:.22;color:var(--hdr-text);pointer-events:none}
.hero .who{position:relative;display:flex;align-items:center;gap:12px}
.hero .who b{font:700 clamp(24px,6vw,30px)/1.1 var(--disp)}
.hero .who .lv{color:var(--hdr-mute);font-size:14px}
.rating{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:14px}
.rating .num{font:700 clamp(64px,17vw,96px)/.85 var(--disp);letter-spacing:-.01em}
.rating .num small{font-size:.62em;font-weight:600;color:var(--hdr-mute)}
.rating .num.nr{color:var(--hdr-mute)}
.rating .side{padding-bottom:6px;font-size:14px;color:var(--hdr-mute)}
.rating .side b{display:block;font:600 18px/1.1 var(--disp);color:var(--hdr-text)}
.rel{position:relative;margin-top:16px}
.rel .track{height:6px;border-radius:999px;background:var(--hdr-line);overflow:hidden}
.rel .track i{display:block;height:100%;border-radius:999px;background:var(--hdr-fill)}
.rel p{margin:6px 0 0;font-size:14px;color:var(--hdr-mute)}
.rel p b{color:var(--hdr-text);font-weight:600}
.stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:16px;background:var(--hdr-line);border-radius:12px;overflow:hidden}
.stats div{background:var(--hdr-panel);padding:10px 12px}
.stats b{display:block;font:700 clamp(22px,5.5vw,28px)/1 var(--disp)}
.stats span{font-size:13px;color:var(--hdr-mute)}

/* sheets */
.sheet{background:var(--card);margin:var(--gap) var(--gap) 0;border-radius:16px;padding:var(--pad);border:1px solid var(--line)}
.sheet.flat{border-radius:0;margin:0;border-width:0 0 1px}
h2{font:700 clamp(22px,5vw,28px)/1.15 var(--disp);margin:0 0 6px;letter-spacing:.005em}
h3{font:600 clamp(17px,4vw,20px)/1.2 var(--disp);margin:16px 0 8px}
.sub,.m{color:var(--muted);font-size:clamp(14px,3.6vw,15px);line-height:1.5}
.sub{margin:0 0 12px}
p{margin:8px 0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--btn);color:var(--btn-text);border:1px solid var(--btn);border-radius:999px;padding:9px 18px;font-weight:600;margin:4px 6px 4px 0;min-height:42px}
.btn.g{background:transparent;color:var(--text);border-color:var(--line)}
.or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--muted);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.gb{display:flex;justify-content:center;min-height:44px}
.btn.w{background:transparent;border-color:var(--down);color:var(--down)}
.btn.big{width:100%;font:700 20px var(--disp);padding:12px 18px;min-height:52px;margin:6px 0}
.btn.ball{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 6px 4px 0;max-width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{border-color:var(--text);outline:none}
textarea{resize:vertical;font-family:inherit}
input.s{width:78px}
input.w100,select.w100,textarea.w100{width:100%;margin-right:0}
label.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:15px}
label.chk input{min-height:0;margin:0}
.field{display:block;margin:10px 0 2px;font-size:14px;color:var(--muted)}

/* rows and lists */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child,.sub+.row,h2+.row{border-top:0}
.row>.g1{flex:1;min-width:140px}
.row.tap{cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;padding:12px 0;flex-wrap:nowrap}
.row .n{font-weight:600}
.rk{font:700 18px var(--disp);color:var(--muted);width:26px;text-align:center}
.rk.top{color:var(--gt)}
.rv{text-align:right;font:700 22px/1 var(--disp)}
.rv span{display:block;font:500 12px var(--body);color:var(--muted);margin-top:3px}
.av{flex:none;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font:700 16px/1 var(--disp);color:#fff;background:var(--c,#B4561F)}
.av{position:relative;overflow:hidden}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:52px;height:52px;font-size:21px;border:2px solid var(--hdr-line)}
.av.xl{width:92px;height:92px;font-size:36px;border:2px solid var(--line)}
.pfp{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pfp .g1{flex:1;min-width:180px}
.crop{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.72)}
.cbox{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(100%,360px);text-align:center}
.cbox canvas{display:block;margin:6px auto 12px;width:280px;max-width:100%;aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab;background:var(--soft);box-shadow:0 0 0 3px var(--text)}
.cbox input[type=range]{accent-color:var(--text);padding:0;min-height:30px;background:none;border:0}
.cbtn{display:flex;gap:8px;justify-content:center;margin-top:6px}.cbtn .btn{margin:4px 0;flex:1}
.chip{display:inline-block;font:600 13px/1.6 var(--disp);border-radius:999px;padding:0 10px;background:var(--soft);color:var(--text);margin-right:4px}
.chip.on{background:var(--btn);color:var(--btn-text)}
.tag{display:inline-block;font:600 13px/1.6 var(--disp);border-radius:999px;padding:0 10px;background:var(--soft);color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}
.wl{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font:700 15px var(--disp);color:#fff;background:var(--down)}
.wl.w{background:var(--up)}
.err{color:var(--down)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0}
.note.warn{background:color-mix(in srgb,var(--down) 12%,var(--card));color:var(--text)}

/* match card */
.court{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0}
.team{background:var(--soft);border-radius:14px;padding:10px;display:grid;gap:8px}
.team.mine{outline:2px solid var(--btn)}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl .av{width:32px;height:32px;font-size:13px}
.pl div{min-width:0}.pl b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl div span{font:600 14px var(--disp);color:var(--muted)}
.vs{font:700 18px var(--disp);color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score input{width:72px;font:700 26px var(--disp);text-align:center;padding:6px}
.exp{font-size:15px}
.court>div{display:grid;gap:4px}
.pick{display:grid;gap:4px;justify-items:center}
.pick>div{display:flex;align-items:center;gap:6px}
.step{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);font:700 24px/1 var(--disp);color:var(--gt)}
.score{justify-content:space-around;margin:8px 0}
.who4 .row{padding:8px 0}.who4 .av{width:32px;height:32px;font-size:13px}

/* search */
.search{position:relative}
.search input{width:100%;padding-left:40px;margin:0}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}

/* calendar strip */
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin-bottom:4px}
.days button{flex:none;min-width:52px;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;color:var(--text)}
.days button.on{background:var(--btn);color:var(--btn-text)}
.days span{font-size:12px}.days b{font:700 20px/1.1 var(--disp)}.days i{font-style:normal;font-size:11px;min-height:14px}

/* misc */
.xp{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin:8px 0}.xp i{display:block;height:100%;background:var(--btn);border-radius:999px}
.rdw{border-radius:18px;padding:clamp(6px,2vw,14px);margin:8px 0 6px}
.rd{display:block;margin:0 auto;max-width:600px;width:100%;height:auto}
.rd text{font:600 15px var(--disp);letter-spacing:.02em;fill:var(--text)}
.rd .rg{fill:none;stroke:var(--line);stroke-width:1}
.rd .rf{stroke-width:2.5;stroke-linejoin:round}
.rdw{background:#FFFBEC}
.rd .rf{fill:#FEBC17;fill-opacity:.7;stroke:#E39F00}
.rd .rp{fill:#E39F00}
@media(min-width:600px){.rd text{font-size:16px}}
.qr{background:#fff;padding:12px;display:inline-block;border-radius:12px}
.big{font:700 52px/1 var(--disp);letter-spacing:.06em;margin:10px 0}
.back{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:inherit;font:600 16px var(--disp);padding:0;margin:0 0 10px}
.empty{color:var(--muted);text-align:center;padding:18px 8px}

/* chat */
.chatwrap{position:relative}
.msgs{display:flex;flex-direction:column;height:min(62vh,520px);min-height:220px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto;padding:10px 4px 6px;scrollbar-width:thin}
.msgs::before{content:"";flex:1 0 0}
.mg{display:flex;flex-direction:column;max-width:78%;margin-top:2px}
.mg.th{align-self:flex-start;align-items:flex-start}.mg.me{align-self:flex-end;align-items:flex-end}
.mg.first,.mg.solo{margin-top:10px}
.mg .nm{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 3px 12px}
.bub{position:relative;max-width:100%;background:var(--soft);color:var(--text);border-radius:19px;padding:8px 13px 9px;font-size:15.5px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;text-align:left;-webkit-user-select:text;user-select:text}
.bub a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.me .bub{background:var(--btn);color:var(--btn-text)}
.th.first .bub,.th.mid .bub{border-bottom-left-radius:6px}.th.mid .bub,.th.last .bub{border-top-left-radius:6px}
.me.first .bub,.me.mid .bub{border-bottom-right-radius:6px}.me.mid .bub,.me.last .bub{border-top-right-radius:6px}
.th.last .bub,.me.last .bub,.th.solo .bub,.me.solo .bub{margin-bottom:0}
.mg .mt{font-size:11px;color:var(--muted);margin:3px 8px 0;line-height:1.2}
.mg .mt.bad{color:var(--down);font-weight:600;background:none;border:0;padding:0;text-align:right}
.mg.pend .bub{opacity:.72}.mg.fail .bub{background:var(--down);color:#fff}
.mg.in{animation:pop .22s cubic-bezier(.2,.8,.3,1) both}.mg.in.me{transform-origin:100% 100%}.mg.in.th{transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.94)}to{opacity:1;transform:none}}
.sep{align-self:center;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;padding:2px 10px;border-radius:999px}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:24px 12px}
.chat-empty b{display:block;font:700 18px var(--disp);color:var(--text);margin-bottom:2px}
.jump{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;font:600 13px var(--body);box-shadow:0 4px 16px rgba(0,0,0,.28);animation:pop .18s ease both}
.jump[hidden]{display:none}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 0 0;border-top:1px solid var(--line);margin-top:6px}
.composer .cin{flex:1;min-width:0;margin:0;min-height:42px;max-height:132px;height:42px;resize:none;overflow-y:auto;border-radius:21px;padding:9px 16px;font-size:16px;line-height:1.38;scrollbar-width:none}
.composer .cin::-webkit-scrollbar{display:none}
.sendb{flex:none;width:42px;height:42px;border-radius:50%;border:0;padding:0;margin:0;display:grid;place-items:center;background:var(--btn);color:var(--btn-text);transition:transform .15s,opacity .15s}
.sendb svg{width:20px;height:20px}
.sendb:active{transform:scale(.9)}
.cin:placeholder-shown+.sendb{opacity:.38;transform:scale(.9)}
/* chat: black borders, message boxes outlined in gold */
.chatwrap,.chatpage{--line:#000}
.chead,.chatpage .composer,.composer{border-color:#000}
.composer .cin{border:2px solid #000}
.composer .cin:focus{border-color:#000}
.bub{border:2px solid #FEBC17}
.sheet.gcs{border:2px solid #000}
.sheet.gcs .composer{border-top:1px solid #000}
.chatpage{display:flex;flex-direction:column;height:var(--vh,100dvh);background:var(--bg)}
.chead{flex:none;position:relative;display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 6px;background:var(--hdr);color:var(--hdr-text);border-bottom:1px solid var(--hdr-line)}
.chead .back{margin:0;padding:6px 8px;font-size:30px;line-height:1;font-family:var(--body)}
.chead .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.chead .who b{display:block;font:700 19px/1.1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .who .lv{color:var(--hdr-mute);font-size:12.5px;line-height:1.2}
.chead .who .av{width:38px;height:38px;font-size:15px}
.chead .more{background:var(--hdr-chip);border:0;color:var(--hdr-text);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chatpage .chatwrap{flex:1;min-height:0;display:flex;flex-direction:column}
.chatpage .msgs{flex:1;height:auto;min-height:0;padding:10px 12px 8px}
.chatpage .composer{margin:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.chatpage .mg{max-width:80%}
body.chatting .app,body.chatting.nav .app{padding-bottom:0}
@media(max-width:1023px){body.chatting .tabs{display:none}}
@media(prefers-reduced-motion:reduce){.mg.in,.jump{animation:none}.sendb{transition:none}}
/* open play */
.queue{margin:0;padding:0;list-style:none}
.queue li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.queue .rk{flex:none}
.queue li.me{font-weight:600}
/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{display:flex;width:100%;max-width:560px;overflow-x:auto}
.tabs button{position:relative;flex:1;min-width:54px;background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 13px var(--disp);color:var(--muted)}
.tabs svg{width:22px;height:22px}
.tabs button.on{color:var(--text)}.tabs button.on svg{stroke-width:2.4}
.bdg{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--down);color:#fff;font:700 11px/16px var(--disp);font-style:normal;text-align:center}
.tabs[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#14100A;color:#FEBC17;border-radius:12px;padding:10px 16px;max-width:92%;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.toast.bad{background:var(--down);color:#fff}

/* getting started */
.steps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--disp);background:var(--soft);color:var(--muted)}
.steps li.done{color:var(--muted)}.steps li.done::before{content:"\2713";background:var(--up);color:#fff}
.steps li.now::before{background:var(--btn);color:var(--btn-text)}
.steps li .m{display:block}
.linkbtn{background:none;border:0;color:var(--gt);padding:4px 0;font-weight:600;text-decoration:underline}

/* login: fits one screen, no scrolling */
.app:has(.welcome){padding-bottom:0;max-width:none}
.welcome{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.welcome .hero{flex:none;display:flex;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px}
.welcome h1{position:relative;margin:0}
.welcome h1.logo{line-height:0;flex:none}.welcome h1.logo img{display:block;width:clamp(76px,22vw,104px);height:auto;border-radius:18px}
.welcome .hero p{position:relative;color:var(--hdr-text);font:600 clamp(18px,5vw,22px)/1.2 var(--disp);max-width:20ch;margin:0}
.welcome .side{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding-top:4px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.welcome .side .sheet:first-child{order:2}
.welcome .side .sheet:last-child{order:1}
@media(max-height:700px){.welcome .side .sheet:first-child{display:none}}

<script>
const $=s=>document.querySelector(s);
let T=localStorage.getItem("pt"),S=null,tab="play",toast="",toastBad=false,authMode="login",GID=null,gsiOn=false,gpend=null,qrText="",qrCode="",showQr=false,calDay=null;
let ov=null,cv=null,OD={},C={},hostForm=false,lastOd=null,sending=false;// ov = open play being viewed, cv = friend whose chat is open, OD = open play details, C = chat messages

let ldAt=0;

  "SUMMARY:"+(b.title+" with "+b.cn).replace(/[,;\n]/g," "),"BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Pickleball session soon","TRIGGER:-PT2H","END:VALARM",

  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="session.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}

let busy=false;
const setBusy=b=>{busy=b;document.body.classList.toggle("busy",b)};
async function run(action,d){
  if(busy)return false;setBusy(true);
  try{const j=await api(action,d);if(j.token){T=j.token;localStorage.setItem("pt",T)}if(j.me){seq++;S=j;S._recv=Date.now();P={};if(j.od){OD[j.od.id]=j.od;lastOd=j.od.id}if(j.club){CD[j.club.id]=j.club;lastClub=j.club.id}CBs=1;say(j.msg||"")}else{await load();return}}
  catch(e){say(e.message,1)}
  finally{setBusy(false)}
  draw();ciPending();return true;
}
let toastT,seq=0;
function say(m,bad){toast=m||"";toastBad=!!bad;clearTimeout(toastT);if(m)toastT=setTimeout(()=>{toast="";const t=document.querySelector(".toast");if(t)t.remove()},/^(Invite|Temporary password)/.test(m)?60000:4000)}
let lastJ="";
async function load(poll){const n=++seq;let same=false;try{const j=await api("state");if(n===seq){const k=JSON.stringify({...j,msg:0,match:j.match&&{...j.match,now:0}});same=poll&&k===lastJ;if(j.match)same=false;// a live game always redraws so its clock moves
lastJ=k;S=j;S._recv=Date.now()}}catch(e){}if(!same)draw(poll);ciPending()}
// a facility QR scanned before logging in is kept until the app is free to check the player in
function ciPending(){const c=sessionStorage.getItem("ci");if(c&&T&&S&&!busy){sessionStorage.removeItem("ci");run("checkin",{code:c})}}

  try{const j=await api(authMode==="reg"?"register":"login",{username:u,password:p});T=j.token;localStorage.setItem("pt",T);await load()}

function gInit(){

async function gLogin(cred,name){
  if(busy)return;setBusy(true);showLoader(name?"Creating your account":"Signing in with Google");
  try{
    const j=await api("google",name?{credential:cred,username:name}:{credential:cred});
    if(j.needName){gpend={cred,email:j.email,suggest:j.suggest}}

  }catch(e){
    const m=e.message;

    else{gpend=null;say(/Too many|disabled|offline|reach|took too long|not set up|unavailable/.test(m)?m:"Google sign-in failed. Try again.",1)}
    draw()
  }
  finally{await hideLoader();setBusy(false)}

}
function geo(){

  return `<div class="rdw"><svg class="rd" viewBox="-70 0 400 282" role="img" aria-label="Skill traits">${[1,2,3,4,5].map(k=>`<polygon points="${f(TR.map((_,i)=>pt(i,k)))}" class="rg" fill="none"/>`).join("")}${TR.map((_,i)=>{const[x,y]=pt(i,5);return`<line x1="${c}" y1="140" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="rg"/>`}).join("")}

// ---- profile picture: choose a photo, move and zoom it in a circle, save a 256 px JPEG ----
function pickAvatar(){let f=document.getElementById("avf");
  if(!f){f=document.createElement("input");f.type="file";f.id="avf";f.accept="image/*";f.hidden=true;f.addEventListener("change",()=>{const x=f.files&&f.files[0];f.value="";if(x)cropAvatar(x)});document.body.appendChild(f)}
  f.click()}
async function bitmapOf(file){if(window.createImageBitmap){try{return await createImageBitmap(file)}catch(_){}}
  return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("bad image"))};i.src=u})}
async function cropAvatar(file){
  if(!/^image\//.test(file.type)){say("Choose an image file.",1);return draw()}
  if(file.size>25e6){say("That photo is too large. Choose one under 25 MB.",1);return draw()}
  let img;try{img=await bitmapOf(file)}catch(_){say("Couldn't read that image. Try a JPEG or PNG.",1);return draw()}
  const W=img.width,H=img.height,BOX=280,base=BOX/Math.min(W,H);let z=1,x=0,y=0;// x,y: image centre relative to the circle centre
  const o=document.createElement("div"),prev=document.activeElement;o.className="crop";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Adjust profile picture");
  o.innerHTML=`<div class="cbox"><h2>Adjust photo</h2><p class="sub">Drag to move. Use the slider to zoom.</p><canvas width="${BOX}" height="${BOX}"></canvas><input type="range" min="1" max="4" step="0.01" value="1" class="w100" aria-label="Zoom"><div class="cbtn"><button class="btn g" type="button" data-c="x">Cancel</button><button class="btn" type="button" data-c="ok">Save photo</button></div></div>`;
  document.body.appendChild(o);
  const cv=o.querySelector("canvas"),g=cv.getContext("2d"),zr=o.querySelector("input");
  const clamp=()=>{const mx=Math.max(0,(W*base*z-BOX)/2),my=Math.max(0,(H*base*z-BOX)/2);x=Math.max(-mx,Math.min(mx,x));y=Math.max(-my,Math.min(my,y))};
  const paint=(c,size)=>{const k=size/BOX,w=W*base*z*k,h=H*base*z*k;c.fillStyle="#222";c.fillRect(0,0,size,size);c.drawImage(img,size/2+x*k-w/2,size/2+y*k-h/2,w,h)};
  const show=()=>{clamp();paint(g,BOX)};show();
  let d=null;
  cv.addEventListener("pointerdown",e=>{d={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor="grabbing"});
  cv.addEventListener("pointermove",e=>{if(!d)return;const k=BOX/cv.getBoundingClientRect().width;x+=(e.clientX-d.x)*k;y+=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};show()});
  const up=()=>{d=null;cv.style.cursor=""};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{e.preventDefault();zr.value=Math.max(1,Math.min(4,+zr.value-e.deltaY/500));zr.dispatchEvent(new Event("input"))},{passive:false});
  zr.addEventListener("input",()=>{z=+zr.value;show()});
  const close=()=>{document.removeEventListener("keydown",esc2);o.remove();if(img.close)img.close();if(prev&&prev.focus)prev.focus()};
  const esc2=e=>{if(e.key==="Escape")close()};document.addEventListener("keydown",esc2);
  o.addEventListener("click",async e=>{const c=e.target.closest("[data-c]");if(!c&&e.target===o)return close();if(!c)return;
    if(c.dataset.c==="x")return close();
    const out=document.createElement("canvas");out.width=out.height=256;paint(out.getContext("2d"),256);
    let q=.86,url=out.toDataURL("image/jpeg",q);while(url.length>110000&&q>.4){q-=.12;url=out.toDataURL("image/jpeg",q)}
    close();await run("setAvatar",{img:url})});
  zr.focus()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
const okScore=(x,y)=>{const hi=Math.max(x,y),lo=Math.min(x,y);return x>=0&&y>=0&&hi-lo>=2&&([11,15,21].includes(hi)||(hi>11&&hi-lo===2))};

  const x=+a,y=+b;p.className=okScore(x,y)?"":"err";p.innerHTML=okScore(x,y)?`You're entering: your team <b>${x>y?"won":"lost"} ${x}-${y}</b>.`:"That isn't a valid final score yet. Games go to 11, 15 or 21 and must be won by 2.";}

// rating hero, shared by Home, Me and other players' profiles
function hero(p,{self,back}={}){
  const nr=p.r==null,games=(p.w|0)+(p.l|0),rel=p.rel|0;
  const relTxt=nr?(self?`<b>NR means not rated yet.</b> Your estimate is ${fmtR(p.pr)}. Play about ${Math.max(1,Math.ceil(3-(p.ip||0)))} more game${Math.ceil(3-(p.ip||0))===1?"":"s"} against rated players to get your official rating.`:`<b>Not rated yet.</b> Estimated ${fmtR(p.pr)} from ${(p.w|0)+(p.l|0)} game${(p.w|0)+(p.l|0)===1?"":"s"}.`)
    :rel===0?`<b>Reliability builds as you play.</b> ${self?"Play a few games with different partners and opponents.":"No recent games yet."}`:rel>=60?`<b>${rel}% reliable.</b> This rating is well established.`:`<b>${rel}% reliable.</b> ${self?"Play with more different partners and opponents to make your rating more reliable.":"Still settling in."}`;
  return `<div class="hero">${COURT}${back?`<button class="back" data-a="back">&lsaquo; Back</button>`:""}
  <div class="who">${av(p.n,1,p.a??p.av??0)}<div><b>${esc(p.n)}</b><div class="lv">${esc(levelOf(p.r))}${p.coach?", certified coach":""}${p.src==="coach"?", coach-rated start":""}</div></div></div>
  <div class="rating">${bigR(p.r)}<div class="side"><b>Doubles</b>club rating</div></div>
  <div class="rel"><div class="track"><i style="width:${nr?0:rel}%"></i></div><p>${relTxt}</p></div>
  ${games?`<div class="stats"><div><b>${games}</b><span>Games</span></div><div><b>${p.w|0}-${p.l|0}</b><span>Won-lost</span></div><div><b>${Math.round((p.w|0)/games*100)}%</b><span>Win rate</span></div></div>`:""}</div>`;
}
function histRows(h){

  return opts(h,x=>`<div class="row"><span class="wl${x.w?" w":""}" aria-label="${x.w?"Win":"Loss"}">${x.w?"W":"L"}</span><div class="g1"><span class="n">${x.s[0]}-${x.s[1]}</span> <span class="m">with ${esc(x.pt)} vs ${x.op.map(esc).join(" and ")}</span><div class="m">${day(x.t)}${x.ot?", "+esc(x.ot):""}${x.d!=null?", expected "+expScore(x.ex??.5)+(x.nr?", provisional":""):""}</div></div>${x.d!=null?`<b class="${x.d>=0?"up":"down"}">${signed(x.d)}</b>`:`<span class="chip">${x.k==="ranked"?"Ranked":"Casual"}</span>`}</div>`);
}

function play(){
  const m=S.match,nb=S.bookings.filter(b=>b.status==="booked"&&b.ts>Date.now()-36e5&&b.ts-Date.now()<864e5).sort((a,b)=>a.ts-b.ts)[0];
  let h=hero({...S.me,n:S.me.username,t:S.me.tier,coach:S.me.role==="certified_coach"},{self:1});
  if(m)h+=matchCard(m); // a ranked match that was already running before open play sessions: keep its score flow
  h+=homeOpen()+homeFriends()+guide();
  if(nb)h+=`<div class="sheet"><h2>Coming up</h2><p>${esc(nb.title)} with ${esc(nb.cn)}, ${when(nb.ts)}</p><p class="m">Check-in code <b>${nb.id}</b></p></div>`;
  if(S.me.last)h+=`<div class="sheet"><h2>Last result</h2><p class="delta">${esc(S.me.last)}</p></div>`;
  return h;
}

function guide(){
  const u=S.me,games=(u.hist||[]).length;
  if(u.role!=="player"||safeGet("gd"+u.id))return"";

  <div class="sheet"><h2>How your rating works</h2><p class="m">Before each game we predict the score from both teams' ratings. Your rating moves by how much you beat or miss that prediction, so a narrow win against weaker players can lower it and a close loss to stronger players can raise it. New players start NR and become rated after about three games against rated players. Reliability grows when you play often with different partners and opponents.</p></div>
  ${u.role==="player"?`<div class="sheet"><h2>Coach invite</h2><p class="sub">Got a token from the admin? Redeem it to become a certified coach.</p><input id="tk" placeholder="Invite token"><button class="btn g" data-a="redeem">Redeem</button></div>`:""}
  ${S.me.ge?`<div class="sheet"><h2>Sign-in</h2><p class="m">You sign in with Google (${esc(S.me.ge)}). There is no password to manage.</p></div>`:`<div class="sheet"><h2>Password</h2><input id="op" type="password" placeholder="Current password" autocomplete="current-password"><input id="np" type="password" placeholder="New password (6+ characters)" autocomplete="new-password"><button class="btn g" data-a="pw">Change password</button></div>`}
  <div class="sheet"><button class="btn w" data-a="logout">Log out</button></div>`;
}
function cal(){
  const days=[...Array(14)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d}),n={};
  S.sessions.forEach(x=>{const k=dk(x.ts);n[k]=(n[k]||0)+1});
  const list=S.sessions.filter(x=>!calDay||dk(x.ts)===calDay);
  return `<div class="sheet"><h2>Lessons and clinics</h2><p class="sub">Book a certified coach for the next two weeks.</p><div class="days"><button class="${!calDay?"on":""}" data-a="day" data-v=""><span>All</span><b>${S.sessions.length}</b><i></i></button>${days.map(d=>{const k=dk(d.getTime());return `<button class="${calDay===k?"on":""}" data-a="day" data-v="${k}"><span>${d.toLocaleDateString([],{weekday:"short"})}</span><b>${d.getDate()}</b><i>${n[k]?n[k]+" open":""}</i></button>`}).join("")}</div>
  ${list.length?opts(list,x=>`<div class="row"><div class="g1"><span class="n">${esc(x.title)}</span><div class="m">${esc(x.coach)}, ${x.kind}, ${x.dur} min, ${when(x.ts)}<br>${money(x.price)}, ${x.left} spot${x.left===1?"":"s"} left</div></div>${x.mine?`<span class="tag">Booked</span>`:x.own?"":`<button class="btn" ${x.left<1?"disabled":""} data-a="book" data-v="${x.id}">Book</button>`}</div>`):`<p class="empty">No sessions ${calDay?"on that day. Try another day":"published yet"}.</p>`}</div>
  <div class="sheet"><h2>My bookings</h2>${S.bookings.length?opts(S.bookings.slice().reverse(),b=>`<div class="row"><div class="g1"><span class="n">${esc(b.title)}</span> <span class="m">with ${esc(b.cn)}</span><div class="m">${when(b.ts)}, ${money(b.price)}, ${b.paid?"paid":"unpaid"}<br>Check-in code <b>${b.id}</b>${!b.paid&&b.price&&b.status!=="cancelled"?`<br>Pay by: ${esc(b.pay||"ask your coach")}<br>${b.ref?`Reference ${esc(b.ref)} sent, waiting for your coach`:`<input id="rf${b.id}" placeholder="E-wallet reference no."><button class="btn g" data-a="ref" data-v="${b.id}">Send reference</button>`}`:""}</div></div><span class="tag">${b.status}</span>${b.status==="booked"?`<div style="width:100%"><button class="btn g" data-a="ics" data-v="${b.id}">Add to calendar</button><button class="btn w" data-a="cancel" data-v="${b.id}">Cancel</button></div>`:""}</div>`):`<p class="empty">Nothing booked yet.</p>`}<p class="m">Add to calendar saves the session to your phone with alerts 1 day and 2 hours before.</p></div>`;
}
function coach(){
  const c=S.coach,nr=c.students.filter(s=>s.r==null);
  return `<div class="sheet"><h2>Publish a session</h2><p class="sub">Your schedule is listed by day below. Overlapping sessions are blocked.</p>

  <div class="score"><label class="m">Price ₱<br><input class="s" id="sp" type="number" min="0" value="800"></label><label class="m">Spots (clinics)<br><input class="s" id="sc" type="number" min="2" value="8"></label><label class="m">Minutes<br><input class="s" id="sd" type="number" min="30" max="240" value="60"></label></div><button class="btn" data-a="addSession">Publish session</button>
  ${(()=>{let last="";return c.sessions.map(x=>{const d=dk(x.ts),h=d!==last?(last=d,`<h3>${new Date(x.ts).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"})}</h3>`):"",w=c.who[x.id]||[];return h+`<div class="row"><div class="g1"><span class="n">${tm(x.ts)} to ${tm(x.ts+x.dur*6e4)}</span> ${esc(x.title)}<div class="m">${x.kind}, ${money(x.price)}, ${x.booked}/${x.cap} booked${w.length?" ("+w.map(esc).join(", ")+")":""}</div></div><button class="btn w" data-a="cancelSession" data-v="${x.id}">Cancel</button></div>`}).join("")})()}</div>
  <div class="sheet"><h2>Check in a student</h2><p class="sub">Tap Check in next to the student, or type the code from their Book tab.</p><input id="bid" placeholder="Booking code"><button class="btn" data-a="attend">Check in (+40 XP)</button>
  ${opts(c.bookings.filter(b=>b.status==="booked").slice(0,8),b=>`<div class="row">${av(b.pn)}<div class="g1"><span class="n">${esc(b.pn)}</span><div class="m">${esc(b.title||b.kind)}, ${when(b.ts)}, code ${b.id}</div></div><button class="btn g" data-a="attend" data-v="${b.id}">Check in</button></div>`)}</div>
  <div class="sheet"><h2>Assess a student</h2>${c.students.length?`<select class="w100" id="stu">${opts(c.students,s=>`<option value="${s.id}">${esc(s.n)}, ${fmtR(s.r)}, ${S.tiers[s.t]}</option>`)}</select>
  <h3>Skill badge</h3><select id="bdg">${opts(Object.entries(S.badgeDefs),([k,d])=>`<option value="${k}">${esc(d.n)}</option>`)}</select><button class="btn" data-a="assess" data-v="1">Pass</button><button class="btn g" data-a="assess" data-v="0">Not yet</button>
  <h3>Starting rating</h3><p class="m">For unrated (NR) students only${nr.length?`: ${nr.map(s=>esc(s.n)).join(", ")}`:". All your students are already rated"}. Use the skill levels: 3.0 recreational, 3.5 competitive recreational, 4.0 skilled, 4.5 advanced.</p>
  <input class="s" id="srt" type="number" step="0.25" min="2" max="6" value="3.0"><button class="btn g" data-a="rate">Set starting rating</button>`:`<p class="empty">Students appear after you check in a booking.</p>`}</div>
  <div class="sheet"><h2>Assign homework</h2>${c.students.length?`<select id="hs">${opts(c.students,s=>`<option value="${s.id}">${esc(s.n)}</option>`)}</select><input id="ht" placeholder="Drill, e.g. 100 cross-court dinks"><input class="s" id="hx" type="number" value="30" aria-label="XP"><button class="btn" data-a="assign">Assign</button>`:`<p class="empty">No students yet.</p>`}
  ${opts(c.hw.filter(h=>h.status==="open"),h=>`<div class="row"><div class="g1"><span class="n">${esc(h.sn)}</span> ${esc(h.title)}<div class="m">+${h.xp} XP</div></div><button class="btn" data-a="approve" data-v="${h.id}">Approve</button></div>`)}</div>
  <div class="sheet"><h2>Payments</h2><p class="sub">Received ₱${(c.revenue/100).toLocaleString()}, still owed ₱${(c.due/100).toLocaleString()}. Players pay you directly by GCash or another e-wallet; mark them paid here once received.</p>
  <input class="w100" id="cp" placeholder="Your GCash / e-wallet number and name" value="${esc(S.me.pay||"")}"><button class="btn g" data-a="setPay">Save payment details</button>${opts(c.bookings.filter(b=>b.status!=="cancelled"&&b.price).slice(0,10),b=>`<div class="row"><div class="g1"><span class="n">${esc(b.pn)}</span><div class="m">${esc(b.title||b.kind)}, ${money(b.price)}${b.ref?", ref "+esc(b.ref):""}</div></div><button class="btn ${b.paid?"":"g"}" data-a="paid" data-v="${b.id}">${b.paid?"Paid":"Mark paid"}</button></div>`)}</div>`;
}
function admin(){
  const a=S.admin,c=a.cfg;
  return `<div class="sheet"><h2>Live and disputed matches</h2>${a.disputes.length?opts(a.disputes,d=>`<div class="row"><div class="g1"><span class="n">${esc(d.court)}</span> <span class="tag">${d.st}, ${d.age} min</span><div>${d.A.map(esc).join(" and ")} vs ${d.B.map(esc).join(" and ")}</div><div class="m">${d.sub.map(esc).join("; ")||"No scores entered"}</div></div>
  <div style="width:100%">${d.st==="disputed"?`<input class="s" id="ra${d.id}" type="number" placeholder="Left"><input class="s" id="rb${d.id}" type="number" placeholder="Right"><button class="btn" data-a="resolve" data-v="${d.id}">Set result</button>`:""}<button class="btn w" data-a="voidMatch" data-v="${d.id}">Void</button></div></div>`):`<p class="empty">No live matches.</p>`}</div>
  <div class="sheet"><h2>Check-in screen</h2><p class="sub">Show this on a tablet at the front desk. The code changes every minute.</p>${showQr?`<div id="qrbox" class="qr"></div><p class="big">${esc(qrCode)}</p><button class="btn g" data-a="qrOff">Hide</button>`:`<button class="btn" data-a="qrOn">Show check-in code</button>`}</div>
  <div class="sheet"><h2>Flagged repeat groups</h2><p class="sub">The same players finishing again and again within 12 hours. Their XP and rating changes are reduced.</p>${(a.flags||[]).length?opts(a.flags,f=>`<div class="row m">${f.names.map(esc).join(", ")}</div>`):`<p class="empty">Nothing flagged.</p>`}</div>
  <div class="sheet"><h2>Facility</h2><label class="field" for="cc">Courts, comma separated</label><input class="w100" id="cc" value="${esc(c.courts.join(", "))}">
  <label class="field">Geofence latitude, longitude and radius in meters (blank turns it off)</label><input class="s" style="width:110px" id="cl" value="${c.lat??""}" placeholder="Latitude"><input class="s" style="width:110px" id="cn" value="${c.lng??""}" placeholder="Longitude"><input class="s" id="cr" value="${c.rad}" placeholder="Radius">
  <label class="field" for="cm">Minimum minutes before a score can be entered</label><input class="s" id="cm" value="${c.minMin}">
  <label class="chk"><input type="checkbox" id="cq" ${c.qr?"checked":""}> Require the front-desk QR code to check in (replaces GPS)</label>
  <label class="field" for="ct">Club time zone, used for the daily quest reset. This device: ${Intl.DateTimeFormat().resolvedOptions().timeZone}</label><input class="w100" id="ct" value="${esc(c.tz)}" placeholder="Asia/Manila"><button class="btn" data-a="setCfg">Save settings</button></div>
  <div class="sheet"><h2>Coach invites</h2><p class="sub">Single-use tokens. Give one to each verified coach.</p><button class="btn" data-a="invite">Create invite token</button>${a.cfg.inv.map(t=>`<div class="row"><code>${t}</code></div>`).join("")}</div>
  <div class="sheet"><h2>Users</h2>${opts(a.users||[],u=>`<div class="row">${av(u.username)}<div class="g1"><span class="n">${esc(u.username)}</span>${u.disabled?` <span class="tag">disabled</span>`:""}<div class="m">${fmtR(u.r)}, ${u.rel|0}% reliable, ${u.xp} XP</div></div>
  <div style="width:100%"><select id="r${u.id}">${opts(["player","certified_coach","admin"],r=>`<option ${r===u.role?"selected":""}>${r}</option>`)}</select>
  <button class="btn g" data-a="setRole" data-v="${u.id}">Set role</button><button class="btn g" data-a="resetElo" data-v="${u.id}">Reset rating</button><button class="btn g" data-a="setDisabled" data-v="${u.id}">${u.disabled?"Enable":"Disable"}</button>${u.id===S.me.id?"":`<button class="btn g" data-a="resetPw" data-v="${u.id}">Reset password</button>`}</div></div>`)}</div>`;
}
function draw(poll){
  const el=$("#app"),f=document.activeElement;
  if(poll&&f&&/INPUT|SELECT|TEXTAREA/.test(f.tagName)&&el.contains(f)&&f.id!=="ps")return;
  const mb=document.getElementById("cm")||document.getElementById("gm"),msgTop=mb?mb.scrollTop:null,msgEnd=mb?nearEnd(mb):true;const vals={},chk={};el.querySelectorAll("input[id],select[id],textarea[id]").forEach(e=>{if(e.type==="checkbox")chk[e.id]=e.checked;else vals[e.id]=e.value});
  const dsl=(el.querySelector(".days")||{}).scrollLeft||0,fid=f&&f.id&&el.contains(f)?f.id:null;let sel=null;try{if(fid&&f.selectionStart!=null)sel=[f.selectionStart,f.selectionEnd]}catch(_){}
  const rest=()=>{el.querySelectorAll("input[placeholder]:not([aria-label]),textarea[placeholder]:not([aria-label])").forEach(e=>e.setAttribute("aria-label",e.placeholder));for(const k in vals){const e=document.getElementById(k);if(e)e.value=vals[k]}for(const k in chk){const e=document.getElementById(k);if(e)e.checked=chk[k]}
    const d=el.querySelector(".days");if(d)d.scrollLeft=dsl;
    if(fid){const e=document.getElementById(fid);if(e){e.focus({preventScroll:true});try{if(sel)e.setSelectionRange(sel[0],sel[1])}catch(_){}}}};
  const tt=toast?`<div class="toast${toastBad?" bad":""}" role="status" aria-live="polite">${esc(toast)}</div>`:"";
  if(!T||!S){document.body.classList.remove("nav");el.innerHTML=login()+tt;rest();gMount();return}
  const r=S.me.role,tabs=[["play","Home"],["players","Leaderboard"],["open","Open Play"],["club","Club"],["friends","Friends"],["cal","Book"],["quests","Quests"],["me","Me"]];
  if(r!=="player")tabs.push(["coach","Coach"]);if(r==="admin")tabs.push(["admin","Admin"]);
  if(!tabs.some(t=>t[0]===tab))tab="play";
  const need=r==="player"&&(!S.me.sk||rtk);
  const body=need?survey():view?profileView(view):ov?opView(ov):cl?clubView(cl):cv?chatView(cv):{play,players,open:openTab,club:clubTab,friends:friendsTab,quests,cal,me,coach,admin}[tab]();
  const ph=need||cv&&!view?"":`<header class="bar"><span class="brand"><img src="logo.png" alt="PickleUP!" width="46" height="46"></span>${r==="player"?"":`<span class="role">${r==="admin"?"Admin":"Coach"}</span>`}<div class="acts">${logoutBtn()}<button class="pf" data-a="tab" data-v="me" aria-label="My profile">${av(S.me.username)}</button></div></header>`;
  const warn=cv&&!view?"":S.me.defaultPw?`<div class="sheet note warn">Change the default admin password on the Me tab.</div>`:S.me.mustChange?`<div class="sheet note warn">You're using a temporary password. Set your own on the Me tab.</div>`:"";
  document.body.classList.toggle("nav",!need);document.body.classList.toggle("chatting",!!(cv&&!view&&!need));
  el.innerHTML=`${ph}${warn}${body}
  <nav class="tabs" aria-label="Sections"${need?" hidden":""}><div>${tabs.map(([k,n])=>`<button class="${k===tab&&!view?"on":""}"${k===tab?' aria-current="page"':""} data-a="tab" data-v="${k}">${ic(k)}${n}${k==="friends"&&S.unread?`<i class="bdg">${S.unread>9?"9+":S.unread}</i>`:""}</button>`).join("")}</div></nav>${tt}`;
  rest();if(document.getElementById("spv"))preview();{const cm=document.getElementById("cm")||document.getElementById("gm");if(cm){cm.scrollTop=msgTop===null||msgEnd?cm.scrollHeight:msgTop;cm.dataset.init=1;cm.dataset.n=cm.querySelectorAll(".mg").length;const t=document.getElementById(cm.id==="cm"?"cx":"gx");chatFit(t)}}
  // profiles (including your own match history on Me) load on demand and are refetched after any change
  const want=need?null:view||(tab==="me"?S.me.id:null);if(want&&!P[want])getProfile(want);
  if(!need&&!view&&cl&&!CD[cl])clubLoad(cl);
  if(!need&&!view&&!cl&&!ov&&((tab==="players"&&pv==="clubs")||tab==="club")&&(!CB||CBs))clubsLoad();
  if(!need&&!view){const g=gcCur();if(g){const okc=g[0]==="club"?(CD[cl]&&CD[cl]!=="loading"&&CD[cl].joined):(OD[ov]&&(OD[ov].isHost||OD[ov].joined));if(okc&&!GC[gk(g[0],g[1])])gcLoad(g[0],g[1])}}
  if(showQr&&tab==="admin"&&window.QRCode){const q=document.getElementById("qrbox");if(q&&!q.firstChild)new QRCode(q,{text:qrText,width:200,height:200})}
}
const pqs=new URLSearchParams(location.search).get("ci");if(pqs){sessionStorage.setItem("ci",pqs);history.replaceState(null,"",location.pathname)}
setInterval(()=>{if(T&&showQr&&tab==="admin"&&!document.hidden)refreshQr(true)},30000);
if(T){draw();showLoader("Logging in");load().finally(()=>hideLoader(500))}else{draw();gInit()}
setInterval(()=>{if(T&&S&&S.match&&tab==="play"&&!view&&!document.hidden)draw(true)},10000);
let tick=0;setInterval(()=>{tick++;if(T&&!document.hidden&&navigator.onLine&&!view&&(tab==="play"||tab==="friends"||tab==="open"||tick%3===0))load(true)},15000);
// chat polls fast (2s) while a conversation is open; open-play details refresh at the old 5s pace
let opT=0;
setInterval(()=>{if(T&&S&&!document.hidden&&navigator.onLine&&!view){if(cv)chatLoad("f:"+cv);else if(ov){if(++opT%3===1)opLoad(ov);const o=OD[ov];if(o&&(o.isHost||o.joined))gcLoad("op",ov)}else if(cl){const k=CD[cl];if(k&&k!=="loading"&&k.joined)gcLoad("club",cl)}}},2000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T){load(true);const k=cCur();if(k)chatLoad(k)}});
// composer: grow with the text, keep the keyboard up when tapping Send, follow the on-screen keyboard
document.addEventListener("input",e=>{if(e.target.classList&&e.target.classList.contains("cin"))chatFit(e.target)});
document.addEventListener("pointerdown",e=>{if(e.target.closest(".sendb"))e.preventDefault()});
document.addEventListener("scroll",e=>{const t=e.target;if(t&&t.classList&&t.classList.contains("msgs")&&nearEnd(t)){const j=document.getElementById(t.id+"j");if(j)j.hidden=true}},true);
if(window.visualViewport){const vv=window.visualViewport,fit=()=>{document.documentElement.style.setProperty("--vh",vv.height+"px");if(document.body.classList.contains("chatting")){scrollTo(0,0);const m=document.getElementById("cm");if(m)toEnd(m)}};vv.addEventListener("resize",fit);vv.addEventListener("scroll",()=>{if(document.body.classList.contains("chatting"))scrollTo(0,0)});fit()}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&T&&S){if((e.target.id==="cx"||e.target.id==="gx")){if(e.shiftKey||e.isComposing)return;e.preventDefault();e.target.id==="cx"?sendMsg():gcSend()}else if(e.target.id==="fn")A.fAddName()}
  if(e.key==="Enter"&&(!T||!S)&&(e.target.id==="u"||e.target.id==="p"))auth();if(e.key==="Enter"&&gpend&&e.target.id==="gu")A.gname()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
